[project]
name = "01-llm-chains-and-prompts"
version = "0.1.0"
description = "Demonstration of LangChain Expression Language (LCEL), Prompt Templates, and Multi-Provider LLM Chains."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.15",
    "langchain-core>=0.3.0",
    "langchain-openai>=1.2.1",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
