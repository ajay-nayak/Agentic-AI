[project]
name = "03-ai-search-agent"
version = "0.1.0"
description = "Autonomous ReAct Search Agent powered by LangChain tools, Tavily Search, and local/cloud LLMs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.15",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.1",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
